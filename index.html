<style>

:root{
  --blue-dark:#1A3A5C;--blue-mid:#2B6CB0;--blue-light:#EBF4FB;--blue-xlight:#F0F7FF;
  --green-dark:#276749;--green-light:#F0FFF4;
  --red-dark:#9B2C2C;--red-light:#FFF5F5;
  --orange-dark:#744210;--orange-light:#FFFBEB;
  --shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --shadow-sm:0 2px 8px rgba(26,58,92,.08);
  --shadow-md:0 4px 20px rgba(26,58,92,.12);
  --shadow-lg:0 8px 40px rgba(26,58,92,.16);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;
  --transition:all .18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#EDF2F7 0%,#E2EBF5 100%);min-height:100vh;color:#2D3748}
.app{max-width:920px;margin:0 auto;padding:20px 14px}
.card{background:#fff;border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.8)}
/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#1A3A5C 0%,#2056A0 55%,#2B6CB0 100%);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:rgba(255,255,255,.05);border-radius:50%}
.hdr::after{content:'';position:absolute;bottom:-60px;left:30%;width:240px;height:240px;background:rgba(43,108,176,.2);border-radius:50%}
.hdr>*{position:relative;z-index:1}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-icon{width:38px;height:38px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(4px)}
.hdr-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.hdr-sub{font-size:11px;opacity:.7;margin-top:2px;letter-spacing:.2px}
/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid #E2E8F0;overflow-x:auto;background:linear-gradient(180deg,#fafcff 0%,#fff 100%)}
.tab{flex:1;min-width:90px;padding:13px 8px;border:none;background:transparent;font-size:12px;font-weight:500;color:#718096;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;transition:var(--transition);letter-spacing:.2px}
.tab:hover{color:#2B6CB0;background:rgba(43,108,176,.04)}
.tab.on{color:var(--blue-dark);font-weight:700;border-bottom-color:var(--blue-mid);background:linear-gradient(180deg,rgba(43,108,176,.06) 0%,transparent 100%)}
.body{padding:22px}
/* ── BUTTONS ── */
.btn{padding:8px 18px;border:none;border-radius:var(--radius-md);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:var(--transition);letter-spacing:.1px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.bp{background:linear-gradient(135deg,#2056A0 0%,#1A3A5C 100%);color:#fff;box-shadow:0 2px 8px rgba(26,58,92,.3)}
.bp:hover{background:linear-gradient(135deg,#2563B8 0%,#1E4576 100%);box-shadow:0 4px 16px rgba(26,58,92,.4)}
.bg{background:#EBF4FB;border:1px solid #C3D9F0;color:var(--blue-dark)}
.bg:hover{background:#DAEcF8;border-color:#A8C9E8}
.bd{background:var(--red-light);border:1px solid #FEB2B2;color:var(--red-dark)}
.bd:hover{background:#FEE8E8}
.bsm{padding:5px 11px;font-size:12px}
/* ── SECTIONS ── */
.sec{border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px;border:1px solid transparent}
.s1{background:linear-gradient(135deg,#EBF4FB 0%,#F0F7FF 100%);border-color:#D4E8F8}
.s2{background:linear-gradient(135deg,#F0FFF4 0%,#F5FFFA 100%);border-color:#C6EBD5}
.s3{background:linear-gradient(135deg,#FFFFF0 0%,#FFFFF7 100%);border-color:#E8E0A0}
.s4{background:linear-gradient(135deg,#FFF5F5 0%,#FFFAFA 100%);border-color:#FED7D7}
.s5{background:linear-gradient(135deg,#F7FAFC 0%,#FAFCFF 100%);border-color:#E6EDF5}
.stl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;opacity:.9}
.lbl{font-size:11px;font-weight:600;color:#4A5568;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.fld{margin-bottom:12px}
/* ── INPUTS ── */
input,select,textarea{width:100%;padding:8px 12px;border:1.5px solid #CBD5E0;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;background:#fff;transition:var(--transition);color:#2D3748}
input:hover,select:hover{border-color:#A8C2D8}
input:focus,select:focus{border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(43,108,176,.12);background:#FAFCFF}
textarea{resize:vertical;min-height:56px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* ── CONFORMITY ROWS ── */
.cr{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #EEF2F7}
.cr:last-child{border-bottom:none}
.cl{flex:1;font-size:13px;color:#2D3748}
.rg{display:flex;gap:10px}
.rg label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;white-space:nowrap;color:#4A5568;font-weight:500}
.rg input{width:auto;margin:0}
/* ── TESTE BOXES ── */
.tb{border:1.5px solid #E2E8F0;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;background:#FAFCFF;transition:var(--transition)}
.tb:hover{border-color:#C3D9F0;box-shadow:var(--shadow-xs)}
.tb .tn{font-weight:700;font-size:12px;color:var(--blue-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tb .tn::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,var(--blue-mid),var(--blue-dark));border-radius:2px;display:inline-block}
/* ── TAGS / CHECKBOXES ── */
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-md);border:1.5px solid #CBD5E0;font-size:12px;cursor:pointer;background:#fff;transition:var(--transition);font-weight:500}
.tag:hover{border-color:var(--blue-mid);background:var(--blue-xlight)}
.tag input{width:auto;margin:0}
.tag.on{background:linear-gradient(135deg,#BEE3F8 0%,#C8EAFC 100%);border-color:#63B3ED;color:var(--blue-dark)}
/* ── RESULT OPTIONS ── */
.ro{flex:1;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-md);cursor:pointer;border:2px solid #E2E8F0;font-weight:700;background:#fff;font-family:inherit;font-size:13px;transition:var(--transition)}
.ro:hover{transform:translateY(-1px);box-shadow:var(--shadow-xs)}
.ro input{width:auto;margin:0}
/* ── ALERTS ── */
.ok{background:linear-gradient(135deg,#F0FFF4,#E8FFF2);border:1.5px solid #68D391;color:var(--green-dark);padding:12px 16px;border-radius:var(--radius-md);font-weight:600;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(39,103,73,.1)}
/* ── SEARCH DROPDOWN ── */
.sw{position:relative}
.sd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid #C3D9F0;border-radius:var(--radius-md);max-height:260px;overflow-y:auto;z-index:99;box-shadow:var(--shadow-md)}
.si{padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #F0F0F0;line-height:1.4;transition:background .12s}
.si:last-child{border-bottom:none}
.si:hover{background:var(--blue-light)}
/* ── LAUDO ── */
.lw{max-width:700px;margin:0 auto;background:#fff;border:1.5px solid #C3D9F0;border-radius:var(--radius-lg);overflow:hidden;font-size:11px;box-shadow:var(--shadow-sm)}
.lh{background:linear-gradient(135deg,#1A3A5C 0%,#2056A0 60%,#2B6CB0 100%);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.lb{padding:12px 18px}
.lk{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;background:linear-gradient(135deg,#EBF4FB,#F0F7FF);border-radius:var(--radius-md);padding:12px;margin-bottom:12px;border:1px solid #D4E8F8}
.kl{font-size:9px;color:#718096;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:13px;font-weight:700;margin-top:3px}
.sh{font-weight:700;font-size:10px;color:var(--blue-dark);border-bottom:2px solid var(--blue-mid);padding-bottom:5px;margin:12px 0 8px;text-transform:uppercase;letter-spacing:.8px}
.lt{width:100%;border-collapse:collapse;margin-bottom:12px}
.lt td{padding:4px 10px;font-size:10px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.lt .th{background:#FAFBFC;font-weight:600;color:#4A5568;width:22%;border-right:1px solid #EEF2F7}
.lt thead th{background:linear-gradient(135deg,#EBF4FB,#F0F7FF);padding:5px 10px;font-size:10px;font-weight:700;color:var(--blue-dark);text-align:left}
.la{background:linear-gradient(135deg,#EBF4FB,#F0F7FF);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;font-size:10px;border:1px solid #D4E8F8}
.lr{border-radius:var(--radius-md);padding:12px 18px;text-align:center;margin-bottom:10px}
.lf{display:flex;justify-content:space-between;font-size:9px;color:#A0AEC0;padding-top:4px}
/* ── ETIQUETAS ── */
.ec{border:2.5px solid var(--blue-dark);border-radius:var(--radius-md);padding:8px 10px;background:#fff;font-size:10px;box-shadow:var(--shadow-xs)}
.eh{color:#fff;text-align:center;font-weight:700;font-size:12px;padding:4px 0;border-radius:6px;margin-bottom:6px;letter-spacing:1.5px}
.en{font-weight:700;font-size:12px;text-align:center;border-bottom:1.5px solid #E2E8F0;padding-bottom:5px;margin-bottom:6px;line-height:1.3;text-transform:uppercase;letter-spacing:.5px;color:#1A3A5C}
.et{width:100%;border-collapse:collapse;font-size:10px}.et td{padding:2px 0;vertical-align:top}
.el{color:#718096;width:28%}.ev{font-weight:600}
.ea{border-top:1.5px solid #E2E8F0;padding-top:5px;margin-top:5px;font-size:9px}
.etg{border-top:1px solid #E2E8F0;padding-top:4px;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 8px;font-size:9px}
/* ── HISTORICO ── */
.hi{border:1.5px solid #E2E8F0;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:var(--transition);box-shadow:var(--shadow-xs)}
.hi:hover{background:var(--blue-xlight);border-color:#C3D9F0;box-shadow:var(--shadow-sm);transform:translateX(2px)}
.hb{display:flex;gap:6px;margin-left:12px;flex-shrink:0}
/* ── ETIQ SELECTOR ── */
.esr{padding:9px 14px;border-bottom:1px solid #EEF2F7;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:background .12s}
.esr:hover,.esr.on{background:var(--blue-light)}
.cb{width:18px;height:18px;border-radius:5px;border:2px solid #CBD5E0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:var(--transition)}
.cb.on{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
/* ── BACKUP INDICATOR ── */
.bkp-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2)}
.bkp-ok{background:rgba(39,103,73,.3);color:#A8F0C6}
.bkp-warn{background:rgba(180,130,0,.35);color:#FFE88A}
.bkp-danger{background:rgba(180,50,50,.35);color:#FFB3B3}
/* ── MISC ── */
.ft{text-align:center;font-size:11px;color:#A0AEC0;margin-top:16px;letter-spacing:.2px}
.err{background:var(--red-light);color:var(--red-dark);padding:16px;border-radius:var(--radius-md);font-family:monospace;font-size:12px;margin:20px;white-space:pre-wrap;border:1px solid #FEB2B2}
@media print{
  @page{size:A4 portrait;margin:8mm}
  .np{display:none!important}
  body{background:#fff}
  .hdr,.tabs{display:none!important}
  .app{padding:0;max-width:100%}
  .card{box-shadow:none;border-radius:0;border:none}
  .body{padding:4px}
  .lw{max-width:100%!important;font-size:9.5px!important;box-shadow:none}
  .lh{padding:7px 12px!important}
  .lb{padding:7px 12px!important}
  .lk{padding:7px!important}
  .lt td{padding:2px 6px!important;font-size:9px!important}
  .epg{display:grid!important;grid-template-columns:1fr 1fr!important;gap:4mm!important}
  .hi,.tb,.sec{box-shadow:none!important;transform:none!important}
}
</style>
</head>

/* ═══════════════════════════════════ IndexedDB ═══════════════════════════════════ */
var IDB={
  DB_NAME:'cq_farmacia',DB_VER:1,_db:null,
  open:function(cb){
    if(IDB._db){cb(null,IDB._db);return;}
    var req=indexedDB.open(IDB.DB_NAME,IDB.DB_VER);
    req.onupgradeneeded=function(ev){
      var db=ev.target.result;
      if(!db.objectStoreNames.contains('entries')){
        var st=db.createObjectStore('entries',{keyPath:'id'});
        st.createIndex('by_ano','ano',{unique:false});
      }
      if(!db.objectStoreNames.contains('config')){db.createObjectStore('config');}
      if(!db.objectStoreNames.contains('userdb')){db.createObjectStore('userdb',{keyPath:'c'});}
    };
    req.onsuccess=function(ev){IDB._db=ev.target.result;cb(null,IDB._db);};
    req.onerror=function(ev){cb(ev.target.error);};
  },
  getYears:function(cb){
    IDB.open(function(err,db){
      if(err){cb([]);return;}
      var tx=db.transaction('entries','readonly');
      var idx=tx.objectStore('entries').index('by_ano');
      var years=new Set();
      idx.openKeyCursor().onsuccess=function(ev){
        var cur=ev.target.result;
        if(cur){years.add(cur.key);cur.continue();}
        else{cb(Array.from(years).filter(function(y){return parseInt(y,10)>=MIN_YEAR;}).sort());}
      };
    });
  },
  loadYear:function(year,cb){
    IDB.open(function(err,db){
      if(err){cb([]);return;}
      var tx=db.transaction('entries','readonly');
      var req=tx.objectStore('entries').index('by_ano').getAll(year);
      req.onsuccess=function(){cb(req.result||[]);};
      req.onerror=function(){cb([]);};
    });
  },
  saveEntry:function(entry,cb){
    IDB.open(function(err,db){
      if(err){if(cb)cb(err);return;}
      var tx=db.transaction('entries','readwrite');
      var req=tx.objectStore('entries').put(entry);
      tx.oncomplete=function(){if(cb)cb(null);};
      tx.onerror=function(){if(cb)cb(tx.error);};
    });
  },
  deleteEntry:function(id,cb){
    IDB.open(function(err,db){
      if(err){if(cb)cb(err);return;}
      var tx=db.transaction('entries','readwrite');
      tx.objectStore('entries').delete(id);
      tx.oncomplete=function(){if(cb)cb(null);};
      tx.onerror=function(){if(cb)cb(tx.error);};
    });
  },
  bulkSave:function(entries,onProgress,cb){
    IDB.open(function(err,db){
      if(err){if(cb)cb(err);return;}
      var tx=db.transaction('entries','readwrite');
      var store=tx.objectStore('entries');
      var i=0,total=entries.length;
      function next(){
        if(i>=total)return;
        var req=store.put(entries[i++]);
        if(i%100===0&&onProgress)onProgress(i,total);
        req.onsuccess=next;req.onerror=next;
      }
      next();
      tx.oncomplete=function(){if(cb)cb(null);};
      tx.onerror=function(){if(cb)cb(tx.error);};
    });
  },
  getAllEntries:function(cb){
    IDB.open(function(err,db){
      if(err){cb([]);return;}
      var tx=db.transaction('entries','readonly');
      var req=tx.objectStore('entries').getAll();
      req.onsuccess=function(){cb(req.result||[]);};
      req.onerror=function(){cb([]);};
    });
  },
  cfg:function(key,cb){
    IDB.open(function(err,db){
      if(err){cb(null);return;}
      var tx=db.transaction('config','readonly');
      var req=tx.objectStore('config').get(key);
      req.onsuccess=function(){cb(req.result!=null?req.result:null);};
      req.onerror=function(){cb(null);};
    });
  },
  setCfg:function(key,val,cb){
    IDB.open(function(err,db){
      if(err){if(cb)cb(err);return;}
      var tx=db.transaction('config','readwrite');
      tx.objectStore('config').put(val,key);
      tx.oncomplete=function(){if(cb)cb(null);};
      tx.onerror=function(){if(cb)cb(tx.error);};
    });
  },
  getUserDB:function(cb){
    IDB.open(function(err,db){
      if(err){cb([]);return;}
      var tx=db.transaction('userdb','readonly');
      var req=tx.objectStore('userdb').getAll();
      req.onsuccess=function(){cb(req.result||[]);};
      req.onerror=function(){cb([]);};
    });
  },
  saveUserDB:function(items,cb){
    IDB.open(function(err,db){
      if(err){if(cb)cb(err);return;}
      var tx=db.transaction('userdb','readwrite');
      var st=tx.objectStore('userdb');
      st.clear();
      items.forEach(function(it){st.put(it);});
      tx.oncomplete=function(){if(cb)cb(null);};
      tx.onerror=function(){if(cb)cb(tx.error);};
    });
  },
};

/* ═══════════════════════════════════ INIT ═══════════════════════════════════ */
function init(){
  var yr=new Date().getFullYear().toString().slice(-2);
  S.workYear=yr;S.histYear=yr;S.etiqYear=yr;
  IDB.open(function(err){
    if(err){
      document.getElementById('root').innerHTML='<div class="err">Erro ao abrir banco de dados: '+err.message+'<br>Tente recarregar a pagina.</div>';
      return;
    }
    /* Check if localStorage has data from old version — migrate */
    var oldData=null;
    try{var raw=localStorage.getItem('cq_entries');if(raw)oldData=JSON.parse(raw);}catch(x){}
    if(oldData&&oldData.length>0){
      migrateLegacy(oldData,yr);
    } else {
      loadState(yr);
    }
  });
}

function migrateLegacy(oldEntries,yr){
  /* Show migration message */
  document.getElementById('root').innerHTML='<div style="text-align:center;padding:60px;color:#4A5568;font-family:Arial"><div style="font-size:32px;margin-bottom:16px">🔄</div><div style="font-size:16px;font-weight:600">Migrando dados para novo sistema...</div><div style="font-size:13px;margin-top:8px;color:#718096" id="mig-msg">Preparando...</div></div>';

  /* Filter out pre-2023 */
  var toMigrate=oldEntries.filter(function(en){return parseInt(en.ano||'0',10)>=MIN_YEAR;});
  var skipped=oldEntries.length-toMigrate.length;
  document.getElementById('mig-msg').textContent='Migrando '+toMigrate.length+' entradas ('+skipped+' anteriores a 2023 ignoradas)...';

  IDB.bulkSave(toMigrate,function(done,total){
    document.getElementById('mig-msg').textContent='Migrando... '+done+'/'+total;
  },function(err){
    if(err){
      document.getElementById('mig-msg').textContent='Erro na migracao: '+err.message;
      return;
    }
    /* Also migrate userdb, overrides */
    try{
      var udb=JSON.parse(localStorage.getItem('cq_userdb')||'[]');
      var ov=JSON.parse(localStorage.getItem('cq_overrides')||'{}');
      IDB.saveUserDB(udb,null);
      IDB.setCfg('overrides',ov,null);
      IDB.setCfg('apiKey',localStorage.getItem('cq_apikey')||'',null);
      IDB.setCfg('driveToken',localStorage.getItem('cq_drive_token')||'',null);
      IDB.setCfg('driveFolderName',localStorage.getItem('cq_drive_folder')||'CQ Farmacia Backup',null);
      /* Clear localStorage to free space */
      localStorage.clear();
    }catch(x){}
    document.getElementById('mig-msg').textContent='Concluido! Carregando sistema...';
    setTimeout(function(){loadState(S.workYear);},800);
  });
}

function loadState(yr){
  var pending=5;
  function done(){if(--pending===0)afterConfig();}
  IDB.cfg('apiKey',function(v){S.apiKey=v||'';done();});
  IDB.cfg('driveToken',function(v){S.driveToken=v||'';done();});
  IDB.cfg('driveFolderName',function(v){S.driveFolderName=v||'CQ Farmacia Backup';done();});
  IDB.cfg('backupLog',function(v){S.backupLog=v||[];done();});
  IDB.cfg('overrides',function(v){S.overrides=v||{};done();});
  function afterConfig(){
    IDB.getUserDB(function(udb){
      S.udb=udb||[];
      IDB.getYears(function(years){
        S.allYears=years;
        if(years.indexOf(yr)===-1)years.push(yr);
        S.allYears=years;
        IDB.loadYear(yr,function(entries){
          S.entries=entries;
          S.histEntries=entries;
          S.etiqEntries=entries;
          S._loading=false;
          checkOAuthReturn();
          paint();
        });
      });
    });
  }
}

/* ── YEAR TAB HELPERS ── */
function yearTabs(selected,action){
  var yr=new Date().getFullYear().toString().slice(-2);
  var years=S.allYears.slice();
  if(years.indexOf(yr)===-1)years.push(yr);
  years=years.filter(function(y){return parseInt(y,10)>=MIN_YEAR;}).sort();
  if(!years.length)years=[yr];
  var r='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">';
  years.forEach(function(y){
    var on=y===selected;
    r+='<button class="btn '+(on?'bp':'bg')+' bsm" data-action="'+action+'" data-val="'+y+'">20'+y+'</button>';
  });
  return r+'</div>';
}

function switchHistYear(year){
  if(year===S.histYear)return;
  S.histYear=year;
  if(year===S.workYear){
    S.histEntries=S.entries;
    repaint();
  } else {
    S._loadingHist=true;repaint();
    IDB.loadYear(year,function(entries){
      S.histEntries=entries;S._loadingHist=false;repaint();
    });
  }
}

function switchEtiqYear(year){
  if(year===S.etiqYear)return;
  S.etiqYear=year;
  if(year===S.workYear){
    S.etiqEntries=S.entries;
    repaint();
  } else {
    S._loadingEtiq=true;repaint();
    IDB.loadYear(year,function(entries){
      S.etiqEntries=entries;S._loadingEtiq=false;repaint();
    });
  }
}

function backupBadge(){
  var log=S.backupLog||[];
  if(!log.length)return '<span class="bkp-badge bkp-danger">⚠️ Sem backup</span>';
  var last=new Date(log[0].dt.split(' ').reverse()[0].split('/').reverse().join('-')+'T'+( log[0].dt.split(' ')[1]||'00:00'));
  var days=Math.floor((Date.now()-last.getTime())/(86400000));
  if(isNaN(days)||days<0)days=0;
  if(days===0)return '<span class="bkp-badge bkp-ok">💾 Backup hoje</span>';
  if(days===1)return '<span class="bkp-badge bkp-ok">💾 Ontem</span>';
  if(days<=7)return '<span class="bkp-badge bkp-warn">💾 Há '+days+' dias</span>';
  return '<span class="bkp-badge bkp-danger">⚠️ '+days+' dias sem backup</span>';}

function backupJSON(data,filename){
  var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();}

function doYearBackup(){
  var stamp=dateStamp();
  var fn=stamp+'_historico_'+S.workYear+'.json';
  backupJSON(S.entries,fn);
  var log={dt:new Date().toLocaleString('pt-BR'),files:[fn],type:'ano'};
  S.backupLog=[log].concat((S.backupLog||[]).slice(0,29));
  IDB.setCfg('backupLog',S.backupLog,null);
  S.msg='✅ Backup de 20'+S.workYear+' realizado!';repaint();setTimeout(function(){S.msg='';},3000);}

function doFullBackup(){
  S.msg='⏳ Gerando backup completo...';repaint();
  IDB.getAllEntries(function(all){
    var stamp=dateStamp();
    var fn=stamp+'_historico_COMPLETO.json';
    backupJSON(all,fn);
    var subFn=stamp+'_substancias_cq.json';
    backupJSON(DB.concat(S.udb),subFn);
    var log={dt:new Date().toLocaleString('pt-BR'),files:[fn,subFn],type:'completo'};
    S.backupLog=[log].concat((S.backupLog||[]).slice(0,29));
    IDB.setCfg('backupLog',S.backupLog,null);
    S.msg='✅ Backup completo: '+all.length+' entradas exportadas!';repaint();setTimeout(function(){S.msg='';},4000);});
}

/* ════════════════════════════════ PAINT ════════════════════════════════ */
function renderTab(){
  if(S.tab==='entrada')return renderEntrada();
  if(S.tab==='laudo')return renderLaudo();
  if(S.tab==='etiqueta')return renderEtiqueta();
  if(S.tab==='historico')return renderHistorico();
  if(S.tab==='gerenciar')return renderGerenciar();
  return '';}

function paint(){
  if(S._loading){document.getElementById('root').innerHTML='<div style="text-align:center;padding:60px;color:#666;font-family:Arial;font-size:16px">⏳ Carregando...</div>';return;}
  document.getElementById('root').innerHTML='<div class="app">'+renderHdr()+renderTabs()+'<div class="card body" id="tb">'+renderTab()+'</div><div class="ft np">CQ — Dados salvos no navegador (IndexedDB)</div></div>';
  renderModals();bindAll();}

function repaint(){
  if(S._loading)return;
  /* Save focus */
  var _af=document.activeElement,_fid=_af?_af.id:null,_fsel=_af&&_af.selectionStart!==undefined?_af.selectionStart:null,_fval=_af?_af.value:null;
  document.getElementById('tb').innerHTML=renderTab();
  renderModals();bindAll();
  /* Restore focus */
  if(_fid){var _rfe=document.getElementById(_fid);if(_rfe&&_fval!==null&&_rfe.value===_fval){_rfe.focus();if(_fsel!==null&&_rfe.setSelectionRange){try{_rfe.setSelectionRange(_fsel,_fsel);}catch(x){}}}}}

function renderModals(){
  var root=document.getElementById('root');
  root.querySelectorAll('.modal-overlay').forEach(function(m){m.remove();});
  [renderFichaModal(),renderAIModal(),renderSubAIModal()].forEach(function(h){if(h){var d=document.createElement('div');d.className='modal-overlay';d.innerHTML=h;root.appendChild(d);}});}

/* ════════════════════════════════ SEARCH ════════════════════════════════ */
function doSearch(q){
  var drop=document.getElementById('sd');if(!drop)return;
  if(q.length<2){drop.style.display='none';return;}
  var res=fdb().filter(function(s){return s.n.toLowerCase().indexOf(q.toLowerCase())>=0;}).slice(0,14);
  if(!res.length){drop.style.display='none';return;}
  var html='';
  res.forEach(function(s){
    html+='<div class="si" data-c="'+e(s.c)+'" data-n="'+e(s.n)+'" data-d="'+e(s.d||'')+'" data-ss="'+e(s.s||'')+'" data-a="'+e(s.a||'')+'" data-dn="'+e(s.dn||'')+'" data-tp="'+e(s.tp||'')+'" data-fte="'+e(s.fte||'')+'" data-ftc="'+e(s.ftc||'')+'" data-org="'+e(s.org||'')+'" data-sol="'+e(s.sol||'')+'" data-fus="'+e(s.fus||'')+'" data-ph="'+e(s.ph||'')+'" data-fm="'+e(s.fm||'')+'" data-pm="'+e(s.pm||'')+'" data-dci="'+e(s.dci||'')+'" data-sin="'+e(s.sin||'')+'" data-ref="'+e(s.ref||'')+'">';
    html+='<span style="font-weight:600">'+e(s.n)+'</span>'+(s.d?'<span style="color:#888;font-size:11px;margin-left:8px">DCB '+e(s.d)+'</span>':'')+(s.s?'<span style="color:#aaa;font-size:11px;margin-left:8px">CAS '+e(s.s)+'</span>':'')+(s.org||s.sol?'<span style="color:#276749;font-size:10px;margin-left:6px">✓ testes</span>':'');
    html+='</div>';
  });
  drop.innerHTML=html;drop.style.display='block';
  drop.querySelectorAll('.si').forEach(function(el){
    el.onclick=function(){
      var d=el.dataset;
      S.form.substancia=d.n;S.form.codigo=d.c;
      if(d.d)S.form.dcb=d.d;if(d.ss)S.form.cas=d.ss;
      if(d.a)S.form.armazenamento=d.a;if(d.dn){S.form.densidade=d.dn;S.form.densidade_ref=d.dn;}
      if(d.tp)S.form.teor_ref=d.tp;if(d.fte)S.form.fator=d.fte;else if(d.ftc)S.form.fator=d.ftc;
      if(d.fm)S.form.formula=d.fm;if(d.pm)S.form.peso=d.pm;if(d.dci)S.form.dci=d.dci;if(d.sin)S.form.sinonimo=d.sin;if(d.ref)S.form.referencias=d.ref;
      if(d.org)S.form.organoleptica_ref=d.org;if(d.sol)S.form.solubilidade_ref=d.sol;
      if(d.fus)S.form.fusao_ref=d.fus;if(d.dn)S.form.densidade_ref=d.dn;if(d.ph)S.form.ph_ref=d.ph;
      drop.style.display='none';repaint();
    };});}

/* ════════════════════════════════ BIND ALL ════════════════════════════════ */

      else if(a==='closeAI'){S.aiModal=false;repaint();}

      else if(a==='saveApiKey'){var k=document.getElementById('ai-key');if(k){S.apiKey=k.value.trim();IDB.setCfg('apiKey',S.apiKey,null);repaint();}}

  document.querySelectorAll('input[type=radio]:checked').forEach(function(el){S.form[el.name]=el.value;});}

function newEntry(){S.form=blank();S.current=null;S.tab='entrada';S.msg='';repaint();}

function saveEntry(){
  collectForm();
  var re=S.form.re||nre();
  var entry=Object.assign({},S.form,{re:re,ano:S.workYear,id:Date.now()});
  S.entries=[entry].concat(S.entries);
  if(S.histYear===S.workYear)S.histEntries=S.entries;
  if(S.etiqYear===S.workYear)S.etiqEntries=S.entries;

function loadE(id){

function vLaudo(id){

function vEtiq(id){

function delE(id){

  S.entries=S.entries.filter(function(x){return String(x.id)!==String(id);});

function togE(id){
  var numC=Object.keys(S.esel).filter(function(k){return S.esel[k];}).length;
  var total=Object.keys(S.esel).reduce(function(a,k){return a+(S.esel[k]||0);},0);
  if(S.esel[id]){var ns=Object.assign({},S.esel);delete ns[id];S.esel=ns;}
  else{if(numC>=8){alert('Max 8 laudos diferentes.');return;}if(total>=8){alert('Max 8 etiquetas.');return;}S.esel[id]=1;}
  repaint();}

function setEQ(id,qty){
  var other=Object.keys(S.esel).filter(function(k){return k!=id;}).reduce(function(a,k){return a+(S.esel[k]||0);},0);

  if(mx<1){var ns=Object.assign({},S.esel);delete ns[id];S.esel=ns;}else{S.esel[id]=mx;}
  repaint();}

function impE(ev){
  var f=ev.target.files[0];if(!f)return;
  S._importing=true;S._importProgress='Lendo arquivo...';repaint();
  var r=new FileReader();
  r.onload=function(ev2){
    try{
      var data=JSON.parse(ev2.target.result);
      if(!Array.isArray(data))throw new Error('Formato invalido');
      /* Filter: only 2023+ */
      var filtered=data.filter(function(x){return parseInt(x.ano||'0',10)>=MIN_YEAR;});
      var skipped=data.length-filtered.length;
      S._importProgress='Salvando '+filtered.length+' entradas ('+skipped+' anteriores a 2023 ignoradas)...';repaint();
      IDB.bulkSave(filtered,function(done,total){
        S._importProgress='Salvando... '+done+'/'+total;
        document.getElementById('tb')&&(document.querySelector('#tb .ok')&&(document.querySelector('#tb .ok').textContent=S._importProgress));
      },function(err){
        S._importing=false;
        if(err){S.msg='Erro ao importar: '+err.message;repaint();return;}
        /* Reload current year */
        IDB.getYears(function(years){
          S.allYears=years.filter(function(y){return parseInt(y,10)>=MIN_YEAR;});
          IDB.loadYear(S.workYear,function(entries){
            S.entries=entries;
            if(S.histYear===S.workYear)S.histEntries=entries;
            if(S.etiqYear===S.workYear)S.etiqEntries=entries;
            S.msg=filtered.length+' entradas importadas!';repaint();setTimeout(function(){S.msg='';},4000);
          });
        });
      });
    }catch(err){S._importing=false;S.msg='Arquivo invalido: '+err.message;repaint();}
  };
  r.readAsText(f);ev.target.value='';}

function impD(ev){
  var f=ev.target.files[0];if(!f)return;
  /* Check size before loading */
  if(f.size>2*1024*1024){
    if(!confirm('Arquivo grande ('+Math.round(f.size/1024)+'KB). Isso pode levar alguns segundos. Continuar?'))return;
  }
  var r=new FileReader();
  r.onload=function(ev2){
    try{
      var data=JSON.parse(ev2.target.result);
      if(!Array.isArray(data))throw new Error('not array');
      var ec=new Set(DB.map(function(s){return s.c;}));
      var newO=data.filter(function(s){return s.n&&!ec.has(s.c);}).map(function(s){return Object.assign({},s,{c:'U'+s.c});});
      S.udb=S.udb.concat(newO);
      IDB.saveUserDB(S.udb,function(){S.msg=newO.length+' substancias importadas!';repaint();setTimeout(function(){S.msg='';},4000);});
    }catch(err){alert('Arquivo invalido: '+err.message);}
  };
  r.readAsText(f);ev.target.value='';}

function callAI(fileInput){
  var file=fileInput.files[0];if(!file)return;
  var isPDF=file.type==='application/pdf';
  var reader=new FileReader();
  reader.onload=function(ev){
    var b64=ev.target.result.split(',')[1];
    var block=isPDF?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}};
    S.aiLoading=true;repaint();
    fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,messages:[{role:'user',content:[block,{type:'text',text:'Este e um laudo de materia-prima de farmacia. Retorne APENAS um JSON valido (sem markdown) com: substancia, fornecedor, lote, nf, qtde, fabricacao (YYYY-MM-DD), validade (YYYY-MM-DD), origem, dcb, cas, fator, teor_fab, organoleptica_result, solubilidade_result, fusao_result, densidade_result, ph_result, armazenamento, obs. Deixe vazio se nao encontrar.'}]}]})
    }).then(function(r){return r.json();}).then(function(data){
      S.aiLoading=false;
      try{var text=data.content[0].text;var clean=text.replace(/```json[\s\S]*?```/g,function(m){return m.replace(/```json\n?/,'').replace(/\n?```/,'');}).replace(/```/g,'').trim();var parsed=JSON.parse(clean);Object.keys(parsed).forEach(function(k){if(parsed[k])S.form[k]=parsed[k];});S.aiModal=false;S.msg='✅ Laudo analisado! Revise os campos.';repaint();setTimeout(function(){S.msg='';},5000);}
      catch(err){alert('Erro ao processar resposta: '+err.message);}
    }).catch(function(err){S.aiLoading=false;repaint();alert('Erro na API: '+err.message);});}
  reader.readAsDataURL(file);}

  var meta=JSON.stringify({name:filename,parents:[folderId]});
  var body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body:body}).then(function(r){return r.json();}).then(function(f){cb(null,f);}).catch(cb);}

function backupToDrive(){
  if(!S.driveToken){alert('Conecte o Drive primeiro.');return;}
  var folder=document.getElementById('drive-folder');
  if(folder)S.driveFolderName=folder.value||'CQ Farmacia Backup';
  IDB.setCfg('driveFolderName',S.driveFolderName,null);
  var stamp=dateStamp();
  S.msg='⏳ Enviando para o Drive...';repaint();
  IDB.getAllEntries(function(all){
    getDriveFolder(S.driveToken,S.driveFolderName,function(err,folderId){
      if(err){S.driveToken='';IDB.setCfg('driveToken','',null);S.msg='❌ Sessao expirada. Reconecte o Drive.';repaint();setTimeout(function(){S.msg='';},4000);return;}
      var hFn=stamp+'_historico_COMPLETO.json';var sFn=stamp+'_substancias_cq.json';
      uploadToDrive(S.driveToken,folderId,hFn,JSON.stringify(all,null,2),function(err2){
        if(err2){S.msg='❌ Erro: '+err2.message;repaint();return;}
        uploadToDrive(S.driveToken,folderId,sFn,JSON.stringify(DB.concat(S.udb),null,2),function(err3){
          if(err3){S.msg='❌ Erro: '+err3.message;repaint();return;}
          var log={dt:new Date().toLocaleString('pt-BR'),files:[hFn,sFn],type:'completo',drive:true};
          S.backupLog=[log].concat((S.backupLog||[]).slice(0,29));IDB.setCfg('backupLog',S.backupLog,null);
          S.msg='✅ Backup salvo no Drive! Pasta: '+S.driveFolderName;repaint();setTimeout(function(){S.msg='';},5000);});
      });
    });
  });}

/* ══════════ START ══════════ */
try{init();}catch(err){document.getElementById('root').innerHTML='<div class="err">Erro: '+err.message+'\n\n'+err.stack+'</div>';}


</script>
